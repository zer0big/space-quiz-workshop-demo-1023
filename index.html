<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>별별 우주 탐사 퀴즈</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f4f3ff;
      --surface: #fff;
      --surface-soft: #f7f6ff;
      --text: #211d3b;
      --muted: #696681;
      --border: #e5e2f2;
      --accent: #6947e8;
      --accent-strong: #5030ca;
      --accent-soft: #eee9ff;
      --correct: #14854c;
      --correct-soft: #e5f8ed;
      --wrong: #c43c52;
      --wrong-soft: #fff0f1;
      --shadow: 0 24px 70px rgb(51 38 105 / 13%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --background: #11101d;
        --surface: #1c1a2b;
        --surface-soft: #252238;
        --text: #f4f1ff;
        --muted: #b7b2cc;
        --border: #38344d;
        --accent: #b09aff;
        --accent-strong: #c5b5ff;
        --accent-soft: #30294b;
        --correct: #62d995;
        --correct-soft: #183b2c;
        --wrong: #ff8392;
        --wrong-soft: #49242d;
        --shadow: 0 24px 70px rgb(0 0 0 / 30%);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 20px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(ellipse at 12% 12%, rgb(157 132 255 / 17%), transparent 34%),
        radial-gradient(ellipse at 90% 85%, rgb(255 184 216 / 16%), transparent 33%),
        var(--background);
      font-family: ui-rounded, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    }

    button { font: inherit; }

    .quiz-shell {
      width: min(100%, 720px);
      position: relative;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 0 4px 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: .9rem;
      font-weight: 750;
      letter-spacing: .02em;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 12px;
      background: var(--accent-soft);
      font-size: 1.2rem;
    }

    .score-pill {
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      font-size: .9rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .score-pill span { color: var(--accent); }

    .card {
      position: relative;
      padding: clamp(24px, 6vw, 48px);
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .card::before {
      position: absolute;
      top: -78px;
      right: -54px;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: var(--accent-soft);
      content: "";
      opacity: .75;
      pointer-events: none;
    }

    .card-content { position: relative; z-index: 1; }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: .82rem;
      font-weight: 850;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    h1, h2 {
      margin: 0;
      font-size: clamp(1.7rem, 5vw, 2.45rem);
      line-height: 1.25;
      letter-spacing: -.045em;
    }

    .intro {
      max-width: 480px;
      margin: 16px 0 28px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.75;
    }

    .start-button, .next-button, .restart-button {
      min-height: 50px;
      padding: 0 22px;
      border: 0;
      border-radius: 15px;
      color: #fff;
      background: #6947e8;
      font-weight: 800;
      cursor: pointer;
      transition: transform .18s ease, filter .18s ease;
    }

    .start-button:hover, .next-button:hover, .restart-button:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .start-button:active, .next-button:active, .restart-button:active { transform: translateY(0); }

    .start-button:focus-visible, .next-button:focus-visible, .restart-button:focus-visible,
    .answer:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    .progress-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: .88rem;
      font-weight: 750;
    }

    .progress-track {
      height: 10px;
      margin-bottom: 30px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--surface-soft);
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #8f6bff, #ff82bc);
      transition: width .45s cubic-bezier(.2, .8, .2, 1);
    }

    .question {
      min-height: 3.2em;
      margin-bottom: 24px;
      font-size: clamp(1.35rem, 4vw, 1.8rem);
    }

    .answers {
      display: grid;
      gap: 12px;
    }

    .answer {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 62px;
      padding: 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      color: var(--text);
      background: var(--surface);
      text-align: left;
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease, transform .18s ease;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: var(--accent);
      background: var(--surface-soft);
    }

    .answer:disabled { cursor: default; }

    .answer-letter {
      display: grid;
      flex: 0 0 34px;
      height: 34px;
      place-items: center;
      border-radius: 11px;
      color: var(--accent);
      background: var(--accent-soft);
      font-size: .88rem;
      font-weight: 850;
    }

    .answer.correct {
      border-color: var(--correct);
      color: var(--correct);
      background: var(--correct-soft);
      animation: pop .42s ease both;
    }

    .answer.wrong {
      border-color: var(--wrong);
      color: var(--wrong);
      background: var(--wrong-soft);
      animation: shake .42s ease both;
    }

    .feedback {
      min-height: 30px;
      margin: 16px 0 4px;
      color: var(--muted);
      font-weight: 750;
      line-height: 1.5;
    }

    .feedback.good { color: var(--correct); }
    .feedback.bad { color: var(--wrong); }

    .next-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 14px;
    }

    .next-button[hidden] { display: none; }

    .result {
      padding: 15px 0 6px;
      text-align: center;
    }

    .result-emoji {
      display: block;
      margin-bottom: 14px;
      font-size: clamp(6rem, 20vw, 9rem);
      animation: float 2.8s ease-in-out infinite;
    }

    .result h2 { margin-bottom: 12px; }
    .result-copy { margin: 0 0 8px; color: var(--muted); line-height: 1.7; }

    .final-score {
      margin: 8px 0 24px;
      color: var(--accent);
      font-size: clamp(2.2rem, 8vw, 3.5rem);
      font-weight: 900;
      letter-spacing: -.05em;
    }

    .result .restart-button { margin-top: 6px; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes pop {
      0% { transform: scale(.97); }
      60% { transform: scale(1.025); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-7px); }
      40%, 80% { transform: translateX(7px); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-8px) rotate(3deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    @media (max-width: 480px) {
      body { padding: 20px 14px; }
      .card { border-radius: 22px; }
      .answer { min-height: 58px; }
    }
  </style>
</head>
<body>
  <main class="quiz-shell" aria-label="우주 탐사 퀴즈">
    <header class="topline">
      <div class="brand"><span class="brand-mark" aria-hidden="true">🚀</span> 별별 우주 탐사대</div>
      <div class="score-pill" aria-live="polite" aria-atomic="true">⭐ 점수 <span id="score">0</span></div>
    </header>

    <section class="card" id="quiz-card" aria-labelledby="screen-title">
      <div class="card-content" id="screen"></div>
    </section>
    <p class="sr-only" id="announcement" aria-live="assertive" aria-atomic="true"></p>
  </main>

  <script>
    (() => {
      const questions = [
        { question: "태양계에서 가장 큰 행성은 무엇일까요?", options: ["토성", "목성", "해왕성", "지구"], answer: 1, fact: "목성은 다른 모든 행성을 합친 것보다도 무거워요!" },
        { question: "붉은 행성이라는 별명을 가진 행성은?", options: ["금성", "수성", "화성", "천왕성"], answer: 2, fact: "화성 표면의 산화철 먼지가 붉게 보여요." },
        { question: "지구의 자연 위성은 무엇일까요?", options: ["달", "포보스", "유로파", "타이탄"], answer: 0, fact: "달은 지구를 도는 유일한 자연 위성이에요." },
        { question: "태양계에서 고리가 가장 눈에 띄는 행성은?", options: ["목성", "토성", "화성", "수성"], answer: 1, fact: "토성의 고리는 얼음과 바위 조각으로 이루어져 있어요." },
        { question: "태양계의 중심에서 빛과 열을 내는 별은?", options: ["시리우스", "북극성", "태양", "알파 센타우리"], answer: 2, fact: "태양은 우리 태양계의 중심에 있는 별이에요." },
        { question: "태양에 가장 가까운 행성은 무엇일까요?", options: ["금성", "지구", "화성", "수성"], answer: 3, fact: "수성은 태양을 약 88일 만에 한 바퀴 돌아요." },
        { question: "우주 비행사가 우주에서 떠다니는 것처럼 보이는 까닭은?", options: ["우주에는 중력이 전혀 없어서", "계속 자유 낙하하는 상태라서", "우주복에 풍선이 있어서", "달이 끌어당겨서"], answer: 1, fact: "우주정거장과 우주 비행사는 함께 지구 주위를 자유 낙하해요." },
        { question: "지구의 대기에서 가장 많은 비율을 차지하는 기체는?", options: ["산소", "이산화 탄소", "질소", "수소"], answer: 2, fact: "지구 대기의 약 78%는 질소예요." },
        { question: "태양빛이 지구에 도착하는 데 걸리는 시간은 약 얼마일까요?", options: ["8분", "8초", "1시간", "하루"], answer: 0, fact: "빛은 1초에 약 30만 km를 이동해 약 8분 만에 도착해요." },
        { question: "태양계에서 가장 큰 화산이 있는 행성은?", options: ["지구", "금성", "화성", "목성"], answer: 2, fact: "화성의 올림푸스산은 태양계에서 알려진 가장 큰 화산이에요." }
      ];

      const screen = document.querySelector("#screen");
      const scoreDisplay = document.querySelector("#score");
      const announcement = document.querySelector("#announcement");
      let order = questions;
      let current = 0;
      let score = 0;
      let locked = false;

      function shuffle(items) {
        const copy = [...items];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function renderIntro() {
        screen.innerHTML = `
          <div class="card-content">
            <p class="eyebrow">MISSION · 01</p>
            <h1 id="screen-title" tabindex="-1">우주 탐사<br>퀴즈에 도전해요!</h1>
            <p class="intro">열 가지 우주 퀴즈를 풀고 당신의 우주 지식을 확인해 보세요. 준비됐다면 탐사를 시작해 볼까요?</p>
            <button class="start-button" type="button" id="start">탐사 시작하기 <span aria-hidden="true">→</span></button>
          </div>`;
        document.querySelector("#start").addEventListener("click", startQuiz);
      }

      function startQuiz() {
        order = shuffle(questions);
        current = 0;
        score = 0;
        scoreDisplay.textContent = score;
        renderQuestion();
      }

      function renderQuestion() {
        locked = false;
        const item = order[current];
        const letters = ["A", "B", "C", "D"];
        screen.innerHTML = `
          <div class="card-content">
            <div class="progress-row">
              <span>질문 ${current + 1} <span aria-hidden="true">/</span> ${questions.length}</span>
              <span>${Math.round((current / questions.length) * 100)}% 진행</span>
            </div>
            <div class="progress-track" role="progressbar" aria-label="퀴즈 진행률" aria-valuemin="0" aria-valuemax="${questions.length}" aria-valuenow="${current}">
              <div class="progress-fill" style="width:${(current / questions.length) * 100}%"></div>
            </div>
            <p class="eyebrow">MISSION · ${String(current + 1).padStart(2, "0")}</p>
            <h1 class="question" id="screen-title" tabindex="-1">${item.question}</h1>
            <div class="answers" role="group" aria-label="답을 선택하세요">
              ${item.options.map((option, index) => `
                <button class="answer" type="button" data-answer="${index}">
                  <span class="answer-letter" aria-hidden="true">${letters[index]}</span>
                  <span>${option}</span>
                </button>`).join("")}
            </div>
            <p class="feedback" id="feedback" aria-live="polite" aria-atomic="true"></p>
            <div class="next-row"><button class="next-button" id="next" type="button" hidden>${current === questions.length - 1 ? "결과 확인하기" : "다음 질문"} <span aria-hidden="true">→</span></button></div>
          </div>`;

        screen.querySelectorAll(".answer").forEach(button => {
          button.addEventListener("click", () => selectAnswer(Number(button.dataset.answer), button));
        });
        screen.querySelector("#next").addEventListener("click", nextQuestion);
        screen.querySelector('[data-answer="0"]').focus();
      }

      function selectAnswer(selected, selectedButton) {
        if (locked) return;
        locked = true;
        const item = order[current];
        const correct = selected === item.answer;
        const buttons = [...screen.querySelectorAll(".answer")];
        buttons.forEach(button => { button.disabled = true; });
        buttons[item.answer].classList.add("correct");

        const feedback = screen.querySelector("#feedback");
        if (correct) {
          score += 1;
          scoreDisplay.textContent = score;
          feedback.className = "feedback good";
          feedback.textContent = `정답이에요! ${item.fact}`;
          announcement.textContent = `정답입니다. 현재 점수 ${score}점. ${item.fact}`;
        } else {
          selectedButton.classList.add("wrong");
          feedback.className = "feedback bad";
          feedback.textContent = `아쉬워요! 정답은 '${item.options[item.answer]}'이에요. ${item.fact}`;
          announcement.textContent = `오답입니다. 정답은 ${item.options[item.answer]}입니다. ${item.fact}`;
        }
        const next = screen.querySelector("#next");
        next.hidden = false;
        next.focus();
      }

      function nextQuestion() {
        current += 1;
        if (current === questions.length) {
          renderResult();
        } else {
          renderQuestion();
        }
      }

      function renderResult() {
        const result = score === questions.length
          ? { emoji: "🏆", title: "우주 박사 탄생!", text: "완벽한 탐사였어요! 우주에 대해 정말 많이 알고 있네요." }
          : score >= 7
            ? { emoji: "🌟", title: "멋진 우주 탐험가!", text: "놀라운 실력이에요. 우주 탐사를 훌륭하게 마쳤어요!" }
            : score >= 4
              ? { emoji: "🪐", title: "반짝이는 발견!", text: "좋은 출발이에요! 더 알아갈수록 우주가 더 재미있어질 거예요." }
              : { emoji: "🚀", title: "첫 탐사 완료!", text: "모험을 시작한 것만으로도 멋져요. 다시 도전해 더 많은 별을 찾아봐요!" };
        screen.innerHTML = `
          <div class="card-content result" aria-labelledby="screen-title">
            <span class="result-emoji" aria-hidden="true">${result.emoji}</span>
            <p class="eyebrow">MISSION COMPLETE</p>
            <h2 id="screen-title" tabindex="-1">${result.title}</h2>
            <p class="result-copy">${result.text}</p>
            <p class="final-score"><span id="final-score-count" aria-hidden="true">0</span><span class="sr-only">${score}점</span><span aria-hidden="true"> / ${questions.length}</span></p>
            <p class="result-copy">맞힌 문제 ${score}개 · 다시 탐사하고 싶다면 언제든 출발!</p>
            <button class="restart-button" id="restart" type="button">다시 도전하기 <span aria-hidden="true">↻</span></button>
          </div>`;
        announcement.textContent = `퀴즈 완료. ${questions.length}문제 중 ${score}문제를 맞혔습니다. ${result.title}`;
        document.querySelector("#restart").addEventListener("click", startQuiz);
        screen.querySelector("#screen-title").focus();
        animateFinalScore(screen.querySelector("#final-score-count"), score);
      }

      function animateFinalScore(element, target) {
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
          element.textContent = target;
          return;
        }
        const duration = 1000;
        const start = performance.now();
        function updateScore(now) {
          const progress = Math.min((now - start) / duration, 1);
          element.textContent = Math.floor(target * (1 - (1 - progress) ** 3));
          if (progress < 1) requestAnimationFrame(updateScore);
        }
        requestAnimationFrame(updateScore);
      }

      renderIntro();
    })();
  </script>
</body>
</html>
